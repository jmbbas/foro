<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#14181f;--mute:#5f6875;--line:#e3e6ea;--accent:#1f3864;--A:#1e7d4f;--Abg:#e3f4ea;--B:#9a6a00;--Bbg:#fff4d6;--E:#1f5fa8;--Ebg:#e2eefb;--shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--ink:#e8ebef;--mute:#9aa3ae;--line:#272d36;--accent:#8fb0ff;--A:#5fd39a;--Abg:#163126;--B:#f0c35a;--Bbg:#33290f;--E:#7fb4ff;--Ebg:#132842;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0 0 10px;letter-spacing:-.01em}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--mute);font:600 14px/1 inherit;padding:10px 4px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.seg button.on{color:#0e1116}}
.chips{display:flex;gap:6px;margin-top:10px;overflow-x:auto}
.chip{border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:999px;padding:6px 12px;font:600 13px/1 inherit;white-space:nowrap;cursor:pointer}
.chip.on{color:var(--ink);border-color:var(--ink)}
.search{width:100%;margin-top:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
main{padding:12px 16px calc(env(safe-area-inset-bottom) + 24px);max-width:720px;margin:0 auto}
.count{color:var(--mute);font-size:13px;margin:2px 2px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;padding:14px;cursor:pointer}
.top .nm{flex:1;min-width:0}
.top .nm b{display:block;font-size:16px}
.top .nm span{color:var(--mute);font-size:13px}
.badge{font:700 11px/1 inherit;padding:5px 8px;border-radius:6px;white-space:nowrap}
.bA{color:var(--A);background:var(--Abg)}.bB{color:var(--B);background:var(--Bbg)}.bE{color:var(--E);background:var(--Ebg)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.dot.done{background:var(--A)}
.chev{color:var(--mute);transition:transform .2s}
.card.open .chev{transform:rotate(90deg)}
.body{display:none;padding:0 14px 14px;border-top:1px solid var(--line)}
.card.open .body{display:block}
.desc{margin:12px 0 4px;color:var(--mute)}
.sec{margin-top:12px}
.sec h4{margin:0 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.sec p{margin:0}
.sec.seg-f p{border-left:3px solid var(--A);padding-left:10px}
.sec.q p{border-left:3px solid var(--accent);padding-left:10px}
textarea{width:100%;min-height:80px;margin-top:4px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;resize:vertical}
label.chk{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;color:var(--mute)}
.empty{text-align:center;color:var(--mute);padding:40px 0}
</style>
</head>

</header>

const ORDER={A:0,B:1,Explorar:2};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let state={day:(['28','29'].includes(store.get('foro_day'))?store.get('foro_day'):'28'),p:'all',q:''};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bcls=p=>p==='A'?'bA':p==='B'?'bB':'bE';
const visited=n=>store.get('v_'+n)==='1';
function render(){
  document.querySelectorAll('#days button').forEach(b=>b.classList.toggle('on',b.dataset.d===state.day));
  const list=document.getElementById('list');
  const q=state.q.trim().toLowerCase();
  let items=DATA.filter(x=>String(x.dia)===state.day)
    .filter(x=>state.p==='all'||(state.p==='todo'?!visited(x.n):x.p===state.p))
    .filter(x=>!q||x.n.toLowerCase().includes(q))
    .sort((a,b)=>ORDER[a.p]-ORDER[b.p]||a.n.localeCompare(b.n,'es'));
  const done=DATA.filter(x=>String(x.dia)===state.day&&visited(x.n)).length;
  const tot=DATA.filter(x=>String(x.dia)===state.day).length;
  if(!items.length){list.innerHTML=`<p class="count">${done}/${tot} visitadas</p><div class="empty">Nada por aquí</div>`;return}
  list.innerHTML=`<p class="count">${items.length} empresas · ${done}/${tot} visitadas</p>`+items.map((x,i)=>{
    const id='c'+i, note=store.get('n_'+x.n)||'';
    return `<div class="card" id="${id}">
      <div class="top" data-t="${id}">
        <span class="dot ${visited(x.n)?'done':''}"></span>
        <div class="nm"><b>${esc(x.n)}</b><span>${esc(x.s)}</span></div>
        <span class="badge ${bcls(x.p)}">${esc(x.p)}</span><span class="chev">›</span>
      </div>
      <div class="body">
        <p class="desc">${esc(x.d)}</p>
        ${x.seg?`<div class="sec seg-f"><h4>Seguimiento</h4><p>${esc(x.seg)}</p></div>`:''}
        ${x.ang?`<div class="sec"><h4>Ángulo</h4><p>${esc(x.ang)}</p></div>`:''}
        ${x.q&&x.q!=='—'?`<div class="sec q"><h4>Qué preguntar</h4><p>${esc(x.q)}</p></div>`:''}
        <div class="sec"><h4>Mis notas / contacto</h4><textarea data-n="${esc(x.n)}" placeholder="Nombre, cargo, qué te han dicho…">${esc(note)}</textarea></div>
        <label class="chk"><input type="checkbox" data-v="${esc(x.n)}" ${visited(x.n)?'checked':''}> Visitada</label>
      </div></div>`}).join('');
}
document.getElementById('days').onclick=e=>{const d=e.target.dataset.d;if(!d)return;state.day=d;store.set('foro_day',d);render();scrollTo(0,0)};
document.getElementById('chips').onclick=e=>{const p=e.target.dataset.p;if(!p)return;state.p=p;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.p===p));render()};
document.getElementById('q').oninput=e=>{state.q=e.target.value;render()};
document.getElementById('list').addEventListener('click',e=>{const t=e.target.closest('[data-t]');if(t)document.getElementById(t.dataset.t).classList.toggle('open')});
document.getElementById('list').addEventListener('input',e=>{if(e.target.dataset.n!==undefined)store.set('n_'+e.target.dataset.n,e.target.value)});
document.getElementById('list').addEventListener('change',e=>{const v=e.target.dataset.v;if(v===undefined)return;store.set('v_'+v,e.target.checked?'1':'0');const card=e.target.closest('.card');card.querySelector('.dot').classList.toggle('done',e.target.checked);const c=document.querySelector('.count');if(c){const done=DATA.filter(x=>String(x.dia)===state.day&&visited(x.n)).length,tot=DATA.filter(x=>String(x.dia)===state.day).length;c.textContent=c.textContent.replace(/\d+\/\d+ visitadas/,done+'/'+tot+' visitadas')}});
render();
</script>
